[project]
name = "xhs-agent"
version = "0.1.0"
description = "小红书实习情报 Agent：基于大模型与 MCP 的实习信息智能检索与抽取系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9.0",
    "openai>=1.70.0",
    "pydantic>=2.10.0",
    "jsonschema>=4.23.0",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.0.1",
    "rich>=13.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xhs_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
